name: CI

on:
  push:
    branches: [main]
    tags: 
      - 'v*.*.*'
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  
  build-linux-bin:

    name: linux-run

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies installation
        run: |
          sudo apt-get update
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh 22

          sudo apt-get install -y llvm-22-dev libpolly-22-dev clang-22 libzstd-dev

      - name: Dependencies check
        run: |
          ls /usr/lib | grep llvm
          clang --version
          clang-22 --version

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Compress
        if: github.event_name != 'pull_request'
        run: tar czf hyperc-linux-x86_64.tar.gz -C target/release hyperc

      - name: Container build
        if: github.event != 'pull_request'
        shell: bash
        run: docker build -t ghcr.io/rub1-618/hyperc:${{ github.ref_name }} .

      - name: Container test
        run: docker run --rm ghcr.io/rub1-618/hyperc:${{ github.ref_name }} --version

      - name: Login to GHCR
        if: startsWith( github.ref, 'refs/tags/v' )
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Push docker image
        if: startsWith( github.ref, 'refs/tags/v' )
        run: docker push ghcr.io/rub1-618/hyperc:${{ github.ref_name }}

      - name: Release
        if: startsWith( github.ref, 'refs/tags/v' )
        run: gh release create ${{ github.ref_name }} hyperc-linux-x86_64.tar.gz --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}