name: "CI"

permissions: 
  contents: write

on: 
    push:
      branches: [main]
      tags: ['v*.*.*']

env:
  CARGO_TERM_COLOR: always

jobs:
    build:

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            
            - name: Install LLVM
              run: |
                sudo apt-get update
                wget https://apt.llvm.org/llvm.sh
                chmod +x ./llvm.sh
                sudo ./llvm.sh 22

                sudo apt-get install -y llvm-22-dev libpolly-22-dev clang-22
            
            - name: Check LLVM and clang
              run: |
                ls /usr/lib | grep llvm
                clang --version
                clang-22 --version

            - name: Tests
              run: cargo test --release

            - name: Build
              run: cargo build --release

            - name: Release
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                tar czf hyperc-linux-x86_64.tar.gz -C target/release hyperc
                gh release create ${{ github.ref_name }} hyperc-linux-x86_64.tar.gz --generate-notes
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}