name: CI

on:
  push:
    branches: [main]
    tags: 
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  
  build-linux-bin:

    name: linux-run

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies installation
        run: |
          sudo apt-get update
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh 22

          sudo apt-get install -y llvm-22-dev libpolly-22-dev clang-22

      - name: Dependencies check
        run: |
          ls /usr/lib | grep llvm
          clang --version
          clang-22 --version

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Compress
        run: tar czf hyperc-linux-x86_64.tar.gz -C target/release hyperc

      - name: Release
        if: startsWith( github.ref, 'refs/tags/v' )
        run: gh release create ${{ github.ref_name }} hyperc-linux-x86_64.tar.gz --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  build-windows-bin:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies installation
        run: winget install LLVM.LLVM

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release